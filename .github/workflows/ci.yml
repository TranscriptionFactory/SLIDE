name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (build, test, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenblas-dev liblapack-dev gfortran cmake clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release --locked
      - name: Test
        run: cargo test --workspace --release --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  python:
    name: Python (slide-py)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev liblapack-dev gfortran
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check DSDP extension built
        run: python -c "from slide_py.knockoff.pydsdp import dsdp"
      - name: Build vendored glmnet
        run: |
          python -m pip install meson ninja
          src=src/slide_py/knockoff/_vendor/glmnet
          meson setup "$src/builddir" "$src"
          ninja -C "$src/builddir"
          cp "$src"/builddir/_glmnet*.so "$src/"
          python -c "from slide_py.knockoff._vendor.glmnet import ElasticNet, LogitNet"
      - name: Test
        run: python -m pytest tests/tests -m "not slow and not requires_r and not requires_rust" -q
      - name: CLI smoke test
        run: slide-py --version
