[workspace]
resolver = "2"
members = [
    "crates/slide-types",
    "crates/slide-love",
    "crates/slide-knockoff",
    "crates/slide-core",
    "crates/slide-glmnet",
    "crates/slide-sdp",
    "crates/slide-cv",
    "crates/slide-score",
    "crates/slide-data-io",
    "crates/slide-cli",
]
default-members = ["crates/slide-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
authors = ["SLIDE contributors"]
repository = "https://github.com/alw399/SLIDE_py"

[workspace.dependencies]
anyhow = "1.0"
csv = "1.3"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
nalgebra-lapack = { version = "0.25", default-features = false, features = ["openblas"] }
ndarray = { version = "0.16", features = ["rayon", "serde"] }
rand = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[workspace.metadata.slide-rs]
description = "Pure Rust port workspace for the SLIDE pipeline"
