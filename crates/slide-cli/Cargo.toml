[package]
name = "slide-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "CLI for the SLIDE (Significant Latent Factor Interaction Discovery and Exploration) pipeline"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "slide"
path = "src/main.rs"

[dependencies]
cairo-rs = { version = "0.20", default-features = false, features = ["png", "pdf"] }
anyhow.workspace = true
csv.workspace = true
ndarray.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json = "1.0"
log = "0.4"
sha2 = "0.10"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
slide-core = { version = "1.0.0", path = "../slide-core" }
slide-cv = { version = "1.0.0", path = "../slide-cv" }
slide-data-io = { version = "1.0.0", path = "../slide-data-io" }
slide-score = { version = "1.0.0", path = "../slide-score" }
slide-types = { version = "1.0.0", path = "../slide-types" }
slide-glmnet = { version = "1.0.0", path = "../slide-glmnet" }
slide-knockoff = { version = "1.0.0", path = "../slide-knockoff" }

[[example]]
name = "paired_xtilde"
test = true
