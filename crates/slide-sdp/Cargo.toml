version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lib]
path = "src/lib.rs"

[dependencies]
blas-src = { version = "0.11.1", features = ["openblas"] }
