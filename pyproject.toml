[build-system]
requires = ["setuptools >= 61.0", "numpy >= 1.20.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loveslide"
version = "1.0.0"
authors = [
  { name="Ally Wang", email="alw399@pitt.edu" },
  { name="Swapnil Keshari", email="swk25@pitt.edu" },
  { name="Aaron R", email="aar126@pitt.edu" },
]
description = "Python implementation of SLIDE (LOVE + Knockoffs)"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"

dependencies = [
    # Core scientific computing (actually used in code)
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "pandas>=2.0.0",
    "joblib>=0.14.1",

    # Opt-in SDP solver (sdp_solver='cvxpy'); DSDP is the default
    "cvxpy>=1.3.0",

    # Progress bars
    "tqdm>=4.60.0",

    # Graph analysis
    "networkx>=3.0.0",

    # Visualization (core)
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Utilities (pyyaml: `loveslide run --config`)
    "easydict",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Visualization extras
viz = [
    "adjustText>=1.0.0",
    "altair>=5.0.0",
    "wordcloud",
    "pysankeybeta",
]

# Single-cell analysis
single-cell = [
    "scanpy>=1.10.0",
    "anndata>=0.10.0",
    "magic-impute",
]

# Deep learning
deep-learning = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pyro-ppl",
]

# Genomics tools
genomics = [
    "genomepy>=0.16.0",
    "goatools>=1.4.0",
    "h5py>=3.8.0",
    "pyarrow>=12.0.0",
]

# Spatial analysis
spatial = [
    "pysal>=24.1",
    "commot",
]

# Extended graph analysis
graph-extended = [
    "python-igraph>=0.10.0",
]

# Optimization extras
optimization = [
    "numba>=0.57.0",
    "group-lasso",
]

# Web/interactive tools
web = [
    "shiny>=0.6.0",
    "ipykernel",
]

# Additional progress bars
progress-extended = [
    "enlighten",
]

# R integration
r = [
    "rpy2>=3.6.7",
]

# Development tools
dev = [
    "pytest>=7.0.0",
    "statsmodels>=0.14",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

# Everything (for legacy compatibility)
full = [
    "loveslide[viz,single-cell,deep-learning,genomics,spatial,graph-extended,optimization,web,progress-extended,r]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"loveslide.knockoff._vendor" = ["**/*"]
"loveslide.dsdp_solver" = ["*.so", "dsdp/**/*"]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[project.scripts]
loveslide = "loveslide.cli:main"

[project.urls]
Homepage = "https://github.com/TranscriptionFactory/SLIDE-rs"
Issues = "https://github.com/TranscriptionFactory/SLIDE-rs/issues"
