[pytest]
# Pytest configuration for SLIDE_py

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Exclude build/env artifacts from collection
norecursedirs = conda_envs test_env_* .conda_pkgs_* build_* __pycache__ .pytest_cache test_outputs

# Output settings
addopts = -v --tb=short -ra

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_r: needs Rscript, rpy2 and the R knockoff package (skipped when missing)
    requires_rust: needs the Rust `slide` binary (skipped when missing)

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:slide_py.*
