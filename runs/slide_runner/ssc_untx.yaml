# SSc UnTx SLIDE run — concrete example using the generic runner.
#
# Usage:
#   cd runs/slide_runner
#   ./submit_slide.sh ssc_untx.yaml

data:
  x_path: /ix/djishnu/Aaron/1_general_use/SLIDE/Data_Scripts/SSc/UnTx/X.csv
  y_path: /ix/djishnu/Aaron/1_general_use/SLIDE/Data_Scripts/SSc/UnTx/Y.csv
  y_factor: false

slide:
  backends: [r_knockoffs, r, python]
  deltas: [0.01, 0.1]
  lambdas: [0.1, 1.0]
  niter: 500
  top_feats: 10
  fdr: 0.1
  thresh_fdr: 0.2
  pure_homo: true
  do_interacts: true
  n_workers: 4
  spec: 0.1
  fstat: glmnet_lambdasmax
  knockoff_method: asdp
  knockoff_shrink: false
  knockoff_offset: 0

cv:
  enabled: true
  nrep: 10
  k: 5
  eval_type: corr

output:
  base_dir: ./ssc_output

slurm:
  job_name: ssc_slide
  time: "2-12:00:00"
  mem: 150G
  cpus_per_task: 4
  cluster: htc
